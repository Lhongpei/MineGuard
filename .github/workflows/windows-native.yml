name: Windows native verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Python 3.12 / Windows Server 2022
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify elevated NTFS ACL grant semantics
        shell: powershell
        run: .\scripts\Test-WindowsAclGrantSemantics.ps1

      - name: Verify trusted bootstrap transactions with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Test-WindowsTrustedBootstrapTransaction.ps1

      - name: Compile both production Inno scripts with minimal release trees
        shell: powershell
        run: .\scripts\Test-WindowsProductionInnoCompile.ps1

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            platform/constraints.txt
            platform/pyproject.toml
            agent/constraints.txt
            agent/pyproject.toml
            connector-service/pyproject.toml
            contracts/requirements-validation.txt

      - name: Set up Node for static JavaScript checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Define isolated runtime paths after runner allocation
        shell: pwsh
        run: |
          $platformVenv = Join-Path $env:RUNNER_TEMP 'MineGuard Platform Runtime'
          $agentVenv = Join-Path $env:RUNNER_TEMP 'MineGuard Agent Runtime'
          $connectorVenv = Join-Path $env:RUNNER_TEMP 'MineGuard Connector Runtime'
          @(
            "PLATFORM_VENV=$platformVenv"
            "PLATFORM_PYTHON=$(Join-Path $platformVenv 'Scripts\python.exe')"
            "AGENT_VENV=$agentVenv"
            "AGENT_PYTHON=$(Join-Path $agentVenv 'Scripts\python.exe')"
            "CONNECTOR_VENV=$connectorVenv"
            "CONNECTOR_PYTHON=$(Join-Path $connectorVenv 'Scripts\python.exe')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install both independent products and verification tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r contracts/requirements-validation.txt tzdata

          python -m venv "$env:PLATFORM_VENV"
          & $env:PLATFORM_PYTHON -m pip install --upgrade pip
          & $env:PLATFORM_PYTHON -m pip install `
            -c platform/constraints.txt -e ./platform
          & $env:PLATFORM_PYTHON -m pip install `
            -c platform/constraints.txt pytest tzdata

          python -m venv "$env:AGENT_VENV"
          & $env:AGENT_PYTHON -m pip install --upgrade pip
          Push-Location agent
          try {
            & $env:AGENT_PYTHON -m pip install `
              --constraint constraints.txt -e ".[dev]" tzdata
          }
          finally {
            Pop-Location
          }

          python -m venv "$env:CONNECTOR_VENV"
          & $env:CONNECTOR_PYTHON -m pip install --upgrade pip
          & $env:CONNECTOR_PYTHON -m pip install -e "./connector-service[test]"
          # Connector repository tests launch the real Agent from source in a
          # subprocess. Install only its third-party runtime libraries here;
          # the deployable Connector package still has no Agent code dependency.
          & $env:CONNECTOR_PYTHON -m pip install `
            --constraint agent/constraints.txt openpyxl xlrd tzdata cryptography

      - name: Verify independent 64-bit runtimes and Asia Shanghai timezone
        shell: pwsh
        run: |
          & $env:PLATFORM_PYTHON -c "import importlib.util, struct; from zoneinfo import ZoneInfo; assert struct.calcsize('P') == 8; assert importlib.util.find_spec('enterprise_agent') is None; print(ZoneInfo('Asia/Shanghai'))"
          & $env:AGENT_PYTHON -c "import importlib.util, struct; from zoneinfo import ZoneInfo; assert struct.calcsize('P') == 8; assert importlib.util.find_spec('mineguard') is None; print(ZoneInfo('Asia/Shanghai'))"
          & $env:CONNECTOR_PYTHON -c "import importlib.util, struct; assert struct.calcsize('P') == 8; assert importlib.util.find_spec('mineguard') is None; assert importlib.util.find_spec('enterprise_agent') is None"

      - name: Parse every Windows deployment script with PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem -Path `
              'platform\deploy\windows', `
              'platform\packaging\windows', `
              'agent\deploy\windows', `
              'agent\packaging\windows', `
              'scripts' `
              -Filter '*.ps1' -File -Recurse
          )
          if ($files.Count -eq 0) {
            throw 'No Windows deployment scripts were found.'
          }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasUtf8Bom = (
              $bytes.Length -ge 3 -and
              $bytes[0] -eq 0xEF -and
              $bytes[1] -eq 0xBB -and
              $bytes[2] -eq 0xBF
            )
            $contentOffset = if ($hasUtf8Bom) { 3 } else { 0 }
            $hasNonAscii = $false
            for ($index = $contentOffset; $index -lt $bytes.Length; $index++) {
              if ($bytes[$index] -gt 0x7F) {
                $hasNonAscii = $true
                break
              }
            }
            if ($hasNonAscii -and -not $hasUtf8Bom) {
              throw (
                "$($file.FullName) contains non-ASCII text but has no " +
                'UTF-8 BOM; Windows PowerShell 5.1 would misdecode it.'
              )
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $details = ($errors | ForEach-Object {
                '{0}:{1}: {2}' -f `
                  $file.FullName,$_.Extent.StartLineNumber,$_.Message
              }) -join [Environment]::NewLine
              throw $details
            }
          }
          Write-Host ("Parsed {0} PowerShell deployment scripts." -f $files.Count)

      - name: Verify GUI wait and real Platform Inno contract
        shell: powershell
        run: .\scripts\Test-WindowsGuiProcessWait.ps1

      - name: Validate neutral exchange contracts
        shell: pwsh
        run: python contracts/scripts/validate_contracts.py

      - name: Validate Windows binary packaging contracts
        shell: pwsh
        run: python scripts/test_windows_packaging.py

      - name: Compile and test the government platform
        shell: pwsh
        run: |
          & $env:PLATFORM_PYTHON -m compileall -q platform/src
          & $env:PLATFORM_PYTHON -m pytest -q platform/tests
          & $env:PLATFORM_PYTHON -m mineguard --help

      - name: Compile, lint and test the enterprise agent
        shell: pwsh
        run: |
          & $env:AGENT_PYTHON -m compileall -q agent/src
          & $env:AGENT_PYTHON -m ruff check agent/src agent/tests
          & $env:AGENT_PYTHON -m pytest -q agent/tests
          & $env:AGENT_PYTHON -m enterprise_agent --help

      - name: Compile, lint and test the enterprise connector
        shell: pwsh
        run: |
          & $env:CONNECTOR_PYTHON -m compileall -q connector-service/src
          & $env:CONNECTOR_PYTHON -m ruff check connector-service/src connector-service/tests
          & $env:CONNECTOR_PYTHON -m pytest -q connector-service/tests
          & $env:CONNECTOR_PYTHON -m enterprise_connector --help

      - name: Check browser JavaScript syntax
        shell: pwsh
        run: |
          node --check platform/src/mineguard/regulatory_web/app.js
          node --check agent/web/v2-app.js

      - name: Verify signed provisioning pair across both products
        shell: pwsh
        run: |
          & $env:AGENT_PYTHON scripts/verify_provisioning_pair.py `
            --platform-python "$env:PLATFORM_PYTHON" `
            --agent-python "$env:AGENT_PYTHON"

      - name: Start both products and verify Windows health endpoints
        shell: pwsh
        run: |
          python scripts/verify_two_process.py `
            --runtime-smoke `
            --timeout 45 `
            --platform-python "$env:PLATFORM_PYTHON" `
            --agent-python "$env:AGENT_PYTHON"
