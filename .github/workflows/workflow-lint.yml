name: GitHub Actions workflow validation

on:
  push:
    paths:
      - ".gitattributes"
      - ".github/**"
      - "agent/deploy/windows/**"
      - "agent/packaging/windows/**"
      - "contracts/examples/*.json"
      - "docs/Windows二进制发行与安装.md"
      - "packaging/windows/**"
      - "platform/deploy/windows/**"
      - "platform/packaging/windows/**"
      - "scripts/*.ps1"
      - "scripts/test_windows_packaging.py"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/**"
      - "agent/deploy/windows/**"
      - "agent/packaging/windows/**"
      - "contracts/examples/*.json"
      - "docs/Windows二进制发行与安装.md"
      - "packaging/windows/**"
      - "platform/deploy/windows/**"
      - "platform/packaging/windows/**"
      - "scripts/*.ps1"
      - "scripts/test_windows_packaging.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflow semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_ARCHIVE_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          tool_root="$RUNNER_TEMP/actionlint"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" "$url"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir --parents "$tool_root"
          tar --extract --gzip --file "$archive" --directory "$tool_root"
          "$tool_root/actionlint" -version
          echo "ACTIONLINT=$tool_root/actionlint" >> "$GITHUB_ENV"

      - name: Validate every workflow and release contract
        shell: bash
        run: |
          set -euo pipefail
          "$ACTIONLINT" -color
          python3 scripts/test_windows_packaging.py
