name: Windows binary installer release

on:
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Build production-candidate installers on the controlled signing runner
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "windows-v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-test:
    name: Build and install-test unsigned artifacts
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1

      - name: Set up CPython 3.12 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            platform/packaging/windows/requirements-build.txt
            platform/constraints.txt
            agent/packaging/windows/build-requirements.txt
            agent/constraints.txt

      - name: Validate packaging contracts statically
        shell: pwsh
        run: python scripts/test_windows_packaging.py

      - name: Parse all release PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem -Path `
              'platform\packaging\windows','platform\deploy\windows', `
              'agent\packaging\windows','agent\deploy\windows','scripts' `
              -Filter '*.ps1' -File -Recurse
          )
          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and `
              $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $offset = if ($hasBom) { 3 } else { 0 }
            $hasNonAscii = $false
            for ($index = $offset; $index -lt $bytes.Length; $index++) {
              if ($bytes[$index] -gt 0x7F) { $hasNonAscii = $true; break }
            }
            if ($hasNonAscii -and -not $hasBom) {
              throw "$($file.FullName) needs a UTF-8 BOM for Windows PowerShell 5.1."
            }
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object {
                "$($file.FullName):$($_.Extent.StartLineNumber): $($_.Message)"
              }) -join [Environment]::NewLine)
            }
          }
          Write-Host "PowerShell 5.1 parsed $($files.Count) release/deployment scripts."

      - name: Preflight release text safety scanner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $auditRoots = @(
            "$pwd\platform\deploy\windows",
            "$pwd\agent\deploy\windows"
          )
          .\scripts\Test-WindowsBinaryRelease.ps1 -SecretAuditRoots $auditRoots

          $negativeRoot = Join-Path $env:RUNNER_TEMP (
            'mineguard-release-secret-negative-' + [Guid]::NewGuid().ToString('N')
          )
          New-Item -ItemType Directory -Path $negativeRoot | Out-Null
          try {
            [IO.File]::WriteAllText(
              (Join-Path $negativeRoot 'hard-coded-secret.ps1'),
              'ADMIN_PASSWORD = "hard-coded-release-secret"',
              (New-Object Text.UTF8Encoding($false))
            )
            $previousErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $negativeOutput = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
                -File .\scripts\Test-WindowsBinaryRelease.ps1 `
                -SecretAuditRoots $negativeRoot 2>&1
              $negativeExitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            if ($negativeExitCode -eq 0) {
              throw 'Release text safety scanner accepted a hard-coded password fixture.'
            }
            $negativeText = $negativeOutput | Out-String
            if ($negativeText -notmatch
                'non-placeholder value for ADMIN_PASSWORD') {
              throw 'Release text safety scanner negative fixture failed for an unexpected reason.'
            }
            Write-Host 'Release text safety scanner rejected the negative fixture as expected.'
          }
          finally {
            if (Test-Path -LiteralPath $negativeRoot) {
              Remove-Item -LiteralPath $negativeRoot -Recurse -Force
            }
          }

      - name: Locate the preinstalled Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $iscc) {
            throw 'ISCC.exe is absent. This workflow never downloads Inno Setup ad hoc.'
          }
          $versionInfo = (Get-Item -LiteralPath $iscc).VersionInfo
          Write-Host (
            "Preinstalled ISCC.exe PE metadata ProductVersion: {0}; FileVersion: {1}" -f `
              $versionInfo.ProductVersion,$versionInfo.FileVersion
          )
          "INNO_COMPILER=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, audit, compile, install, health-check and uninstall
        shell: powershell
        run: |
          .\scripts\Build-WindowsBinaryRelease.ps1 `
            -OutputDirectory "$pwd\release\windows" `
            -InnoCompiler $env:INNO_COMPILER `
            -AllowNuitkaToolDownloads `
            -TestInstallerFailurePropagation `
            -TestInstallerLifecycle

      - name: Upload explicit unsigned test media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mineguard-windows-UNSIGNED-TEST-ONLY-${{ github.sha }}
          path: |
            release/windows/*-UNSIGNED-TEST-ONLY.exe
            release/windows/release-manifest.json
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  signed-production-candidate:
    name: Build signed production-candidate artifacts
    needs: unsigned-test
    if: github.event_name == 'workflow_dispatch' && inputs.sign_artifacts
    runs-on: [self-hosted, windows, x64, signing]
    environment: windows-production-signing
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      WINDOWS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
      WINDOWS_SIGNTOOL_SHA256: ${{ vars.WINDOWS_SIGNTOOL_SHA256 }}
      WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_RELEASE_PYTHON_EXECUTABLE: ${{ vars.WINDOWS_RELEASE_PYTHON_EXECUTABLE }}
      WINDOWS_RELEASE_PYTHON_PATCH_VERSION: ${{ vars.WINDOWS_RELEASE_PYTHON_PATCH_VERSION }}
      WINDOWS_RELEASE_PYTHON_EXECUTABLE_SHA256: ${{ vars.WINDOWS_RELEASE_PYTHON_EXECUTABLE_SHA256 }}
      WINDOWS_RELEASE_WHEELHOUSE: ${{ vars.WINDOWS_RELEASE_WHEELHOUSE }}
      WINDOWS_RELEASE_WHEELHOUSE_MANIFEST: ${{ vars.WINDOWS_RELEASE_WHEELHOUSE_MANIFEST }}
      WINDOWS_RELEASE_WHEELHOUSE_MANIFEST_SHA256: ${{ vars.WINDOWS_RELEASE_WHEELHOUSE_MANIFEST_SHA256 }}
      INNO_COMPILER: ${{ vars.WINDOWS_INNO_COMPILER }}
      INNO_COMPILER_SHA256: ${{ vars.WINDOWS_INNO_COMPILER_SHA256 }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1

      - name: Validate controlled local tools and media
        shell: powershell
        run: |
          foreach ($required in @(
            $env:WINDOWS_SIGNTOOL_PATH,
            $env:WINDOWS_SIGNTOOL_SHA256,
            $env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT,
            $env:WINDOWS_TIMESTAMP_URL,
            $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE,
            $env:WINDOWS_RELEASE_PYTHON_PATCH_VERSION,
            $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE_SHA256,
            $env:WINDOWS_RELEASE_WHEELHOUSE,
            $env:WINDOWS_RELEASE_WHEELHOUSE_MANIFEST,
            $env:WINDOWS_RELEASE_WHEELHOUSE_MANIFEST_SHA256,
            $env:INNO_COMPILER,
            $env:INNO_COMPILER_SHA256
          )) {
            if ([string]::IsNullOrWhiteSpace($required)) {
              throw 'The signing environment is missing a required non-secret configuration value.'
            }
          }
          if (-not (Test-Path -LiteralPath $env:WINDOWS_SIGNTOOL_PATH -PathType Leaf)) {
            throw 'The preinstalled signtool.exe path is invalid.'
          }
          if (-not (Test-Path -LiteralPath $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE -PathType Leaf)) {
            throw 'The controlled preinstalled python.exe path is invalid.'
          }
          if (-not (Test-Path -LiteralPath $env:INNO_COMPILER -PathType Leaf)) {
            throw 'The preinstalled ISCC.exe path is invalid; no tool will be downloaded.'
          }
          if (-not (Test-Path -LiteralPath $env:WINDOWS_RELEASE_WHEELHOUSE -PathType Container)) {
            throw 'The approved offline wheelhouse is unavailable.'
          }
          if (-not (Test-Path -LiteralPath $env:WINDOWS_RELEASE_WHEELHOUSE_MANIFEST -PathType Leaf)) {
            throw 'The approved wheelhouse supply-chain manifest is unavailable.'
          }
          if ($env:WINDOWS_RELEASE_WHEELHOUSE_MANIFEST_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') {
            throw 'The protected wheelhouse manifest SHA-256 must contain exactly 64 hexadecimal digits.'
          }
          foreach ($expectedHash in @(
            $env:WINDOWS_SIGNTOOL_SHA256,
            $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE_SHA256,
            $env:INNO_COMPILER_SHA256
          )) {
            if ($expectedHash -notmatch '^[A-Fa-f0-9]{64}$') {
              throw 'Every protected tool SHA-256 must contain exactly 64 hexadecimal digits.'
            }
          }
          if ($env:WINDOWS_RELEASE_PYTHON_PATCH_VERSION -notmatch '^3\.12\.\d+$') {
            throw 'The protected Python version must be an exact CPython 3.12 patch.'
          }
          $actualPythonHash = (Get-FileHash -LiteralPath `
            $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE -Algorithm SHA256).Hash
          if ($actualPythonHash -ne $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE_SHA256) {
            throw 'The controlled python.exe does not match its protected SHA-256.'
          }
          $actualPythonVersion = (& $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE `
            -c 'import platform; print(platform.python_version())' | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $actualPythonVersion -ne $env:WINDOWS_RELEASE_PYTHON_PATCH_VERSION) {
            throw 'The controlled python.exe does not match its protected patch version.'
          }
          & $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE scripts/test_windows_packaging.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging static checks failed.' }
          Write-Host "Preinstalled ISCC.exe version: $((Get-Item $env:INNO_COMPILER).VersionInfo.ProductVersion)"

      - name: Build, sign, audit and lifecycle-test both installers
        shell: powershell
        env:
          WINDOWS_RELEASE_OUTPUT: ${{ runner.temp }}\mineguard-signed-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          .\scripts\Build-WindowsBinaryRelease.ps1 `
            -OutputDirectory $env:WINDOWS_RELEASE_OUTPUT `
            -Wheelhouse $env:WINDOWS_RELEASE_WHEELHOUSE `
            -WheelhouseManifest $env:WINDOWS_RELEASE_WHEELHOUSE_MANIFEST `
            -ExpectedWheelhouseManifestSha256 $env:WINDOWS_RELEASE_WHEELHOUSE_MANIFEST_SHA256 `
            -PythonExecutable $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE `
            -ExpectedPythonPatchVersion $env:WINDOWS_RELEASE_PYTHON_PATCH_VERSION `
            -ExpectedPythonExecutableSha256 $env:WINDOWS_RELEASE_PYTHON_EXECUTABLE_SHA256 `
            -InnoCompiler $env:INNO_COMPILER `
            -ExpectedInnoCompilerSha256 $env:INNO_COMPILER_SHA256 `
            -SignToolPath $env:WINDOWS_SIGNTOOL_PATH `
            -ExpectedSignToolSha256 $env:WINDOWS_SIGNTOOL_SHA256 `
            -SigningCertificateThumbprint $env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT `
            -TimestampUrl $env:WINDOWS_TIMESTAMP_URL `
            -RequireSigned `
            -TestInstallerFailurePropagation `
            -TestInstallerLifecycle

      - name: Upload signed production candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mineguard-windows-signed-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mineguard-signed-${{ github.run_id }}-${{ github.run_attempt }}/MineGuard-Platform-*-windows-x64.exe
            ${{ runner.temp }}/mineguard-signed-${{ github.run_id }}-${{ github.run_attempt }}/MineGuard-EnterpriseAgent-*-windows-x64.exe
            ${{ runner.temp }}/mineguard-signed-${{ github.run_id }}-${{ github.run_attempt }}/release-manifest.json
            ${{ runner.temp }}/mineguard-signed-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
