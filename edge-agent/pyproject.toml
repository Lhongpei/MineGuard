[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mine-edge-agent"
version = "0.1.0"
description = "Read-only mine-side data acquisition, local warning and store-and-forward agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Qinyuan Mine Monitoring Project"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mine-edge-agent = "mine_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/mine-edge-agent/web" = [
  "web/index.html",
  "web/app.js",
  "web/styles.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
