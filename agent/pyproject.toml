[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-reporting-agent"
dynamic = ["version"]
description = "Production-candidate enterprise reporting agent for governed submissions"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "Enterprise Reporting Agent"}]
dependencies = [
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "enterprise_agent.__version__"}

[tool.setuptools.data-files]
"share/enterprise-reporting-agent/web" = [
  "web/index.html",
  "web/app.js",
  "web/v2-app.js",
  "web/styles.css",
  "web/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
