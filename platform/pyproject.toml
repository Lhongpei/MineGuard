[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineguard-mvp"
version = "0.5.0"
description = "煤矿多源交叉验证与监管核查闭环内网影子运行版"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    # Windows does not ship an IANA timezone database.  Keep this unconditional
    # so every recorded runtime manifest identifies the same timezone data.
    "tzdata>=2025.2",
    "olefile>=0.47,<0.48",
    "xlrd>=2.0.1,<3.0",
]

[project.scripts]
mineguard = "mineguard.product_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mineguard = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/*.svg",
  "web/*.png",
  "web/*.webmanifest",
  "regulatory_web/*.html",
  "regulatory_web/*.css",
  "regulatory_web/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
